<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PostoCSV Settings</title>
    <style>
        body { max-width: 760px; margin: 24px auto; padding: 0 16px; font-family: sans-serif; }
        textarea { width: 100%; height: 90px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
        table { border-collapse: collapse; width: 100%; }
        th, td { text-align: left; padding: 4px; }
        td input, td select { width: 100%; box-sizing: border-box; padding: 4px; }
        td.row-actions { white-space: nowrap; width: 1%; }
        td.row-actions button { padding: 4px 8px; background-color: #6c757d; }
        td.row-actions button.remove { background-color: #dc3545; }
        button:disabled { opacity: 0.4; cursor: default; }
        #addBtn { background-color: #1da1f2; margin-top: 8px; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        button, label.button { padding: 8px 14px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        #saveBtn { background-color: #28a745; }
        label.button { background-color: #1da1f2; }
        #exportBtn { background-color: #6f42c1; }
        #resetBtn { background-color: #dc3545; }
        #grantBtn { background-color: #fd7e14; }
        #importFile { display: none; }
        #status { min-height: 20px; font-size: 14px; }
        .success { color: green; }
        .error { color: red; }
        code { background: #f1f1f1; padding: 1px 4px; border-radius: 3px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>PostoCSV Settings</h2>
    <h3>CSV columns</h3>
    <table>
        <thead><tr><th>Column title</th><th>Data</th><th></th></tr></thead>
        <tbody id="columns"></tbody>
    </table>
    <button id="addBtn">Add column</button>
    <h3>Delimiter</h3>
    <select id="delimiter" aria-label="Delimiter"></select>
    <h3>Mastodon instances</h3>
    <p>One hostname per line, e.g. <code>mastodon.social</code>.</p>
    <textarea id="hosts" spellcheck="false" aria-label="Mastodon instances"></textarea>
    <div class="actions">
        <button id="saveBtn">Save</button>
        <label class="button" for="importFile">Import file</label>
        <input type="file" id="importFile" accept=".json,application/json">
        <button id="exportBtn">Export file</button>
        <button id="resetBtn">Reset to default</button>
        <button id="grantBtn" class="hidden">Grant access to Mastodon hosts</button>
    </div>
    <div id="status"></div>
    <script src="../config.js"></script>
    <script src="settings.js"></script>
</body>
</html>
