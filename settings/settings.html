<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PostoCSV Settings</title>
    <style>
        body { max-width: 760px; margin: 24px auto; padding: 0 16px; font-family: sans-serif; }
        textarea { width: 100%; height: 420px; font-family: monospace; font-size: 13px; box-sizing: border-box; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        button, label.button { padding: 8px 14px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; }
        #saveBtn { background-color: #28a745; }
        label.button { background-color: #1da1f2; }
        #exportBtn { background-color: #6f42c1; }
        #resetBtn { background-color: #dc3545; }
        #grantBtn { background-color: #fd7e14; }
        #importFile { display: none; }
        #status { min-height: 20px; font-size: 14px; }
        .success { color: green; }
        .error { color: red; }
        code { background: #f1f1f1; padding: 1px 4px; border-radius: 3px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2>PostoCSV Settings</h2>
    <p>Available fields: <span id="fields"></span></p>
    <p>Delimiters: <code>,</code> <code>;</code> <code>|</code> <code>\t</code></p>
    <textarea id="configText" spellcheck="false"></textarea>
    <div class="actions">
        <button id="saveBtn">Save</button>
        <label class="button" for="importFile">Import file</label>
        <input type="file" id="importFile" accept=".json,application/json">
        <button id="exportBtn">Export file</button>
        <button id="resetBtn">Reset to default</button>
        <button id="grantBtn" class="hidden">Grant access to Mastodon hosts</button>
    </div>
    <div id="status"></div>
    <script src="../config.js"></script>
    <script src="settings.js"></script>
</body>
</html>
